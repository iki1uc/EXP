<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>EXP‑Station · Vollachse · EXPANDER</title>

<style>
body { background:#000; color:#0f0; font-family:monospace; padding:40px; }
h1 { color:#6cf; margin-bottom:20px; }
.section { background:#111; border:1px solid #333; padding:20px; margin-bottom:25px; }
.title { color:#6cf; font-size:20px; margin-bottom:10px; }
pre { background:#000; border-left:3px solid #6cf; padding:10px; white-space:pre-wrap; }
</style>
</head>

<body>

<h1>EXP‑Station · Vollachse · EXPANDER</h1>

<div id="output"></div>

<script type="module">

import { EXP_AXIS } from "./EXP‑Achse.vector";
import { STATION_EXP } from "./EXP‑Station.vector";
import { PIPELINE_EXP } from "./EXP‑Pipeline";
import { VectorEXP } from "./EXP‑Vector.vector";

async function run() {

    const vector = {
        id: "EXP",
        axis: EXP_AXIS,
        evo: 360,
        geo: 360,
        radar: 360
    };

    const exp = VectorEXP(vector);

    const html = `
        <div class="section">
            <div class="title">EXP‑Vector · EXPANDER</div>
            <pre>
Achse:
  x: ${exp.axis.x}
  y: ${exp.axis.y}
  z: ${exp.axis.z}
  rot: ${exp.axis.rot}
  full: ${exp.axis.full}

Station:
  Name: ${STATION_EXP.name}
  Typ: ${STATION_EXP.type}
  Modus: ${STATION_EXP.mode}
  Zustand: ${STATION_EXP.state}
  Real: ${STATION_EXP.real}

Pipeline:
  3: ${PIPELINE_EXP[3]}
  6: ${PIPELINE_EXP[6]}
  ∞: ${PIPELINE_EXP.infinity}

EXP‑Vector:
  ID: ${exp.id}
  EVO: ${exp.evo}°
  GEO: ${exp.geo}
  Radar: ${exp.radar}
  Status: ${exp.status}
            </pre>
        </div>
    `;

    document.getElementById("output").innerHTML = html;
}

run();

</script>

</body>
</html>
