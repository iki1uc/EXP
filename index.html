<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RESPO · EXP · Station</title>

<style>
body { background:#000; color:#0f0; font-family:monospace; padding:40px; }
h1 { color:#6cf; margin-bottom:20px; }
.section { background:#111; border:1px solid #333; padding:20px; margin-bottom:25px; }
.title { color:#6cf; font-size:18px; margin-bottom:10px; }
pre { background:#000; border-left:3px solid #6cf; padding:10px; white-space:pre-wrap; }
</style>
</head>

<body>

<h1>RESPO · EXP · Station</h1>

<div id="output"></div>

<script type="module">

import { VectorTranslate } from "./row.id.js";
import { RESPO_STATION_MASTER } from "./Station.vector.js";
import { VectorEXP } from "./EXP-Vector.vector";

async function loadCSV(path) {
    const text = await fetch(path).then(r => r.text());
    const lines = text.trim().split("\n");
    const header = lines[0].split(";");
    return lines.slice(1).map(line => {
        const cols = line.split(";");
        const obj = {};
        header.forEach((h, i) => obj[h] = cols[i]);
        return obj;
    });
}

async function run() {

    const rows = await loadCSV("./12.csv");

    let html = "";

    rows.forEach(row => {

        const vector = VectorTranslate(row);
        const station = RESPO_STATION_MASTER(vector);
        const exp = VectorEXP(vector);

        html += `
        <div class="section">
            <div class="title">ID ${vector.id}</div>
            <pre>

Achse:
  x: ${vector.axis.x}
  y: ${vector.axis.y}
  z: ${vector.axis.z}
  rot: ${vector.axis.rot}
  full: ${exp.axis.full}

Station:
  name: EXP
  state: ${vector.station.state}
  real: ${vector.station.real}

GEO:
  state: ${station.geo.position}
  sweep: ${station.geo.sweep}

Radar:
  state: ${station.radar.radar}
  sweep: ${station.radar.sweep}

EVO:
  raw: ${station.evo.raw}
  value: ${station.evo.evo}

EXP:
  status: ${exp.status}
  evo: ${exp.evo}
  geo: ${exp.geo}
  radar: ${exp.radar}

Pipeline:
  3: Zustand
  6: Overdrive
  EXP: offen

ID:
  type: Vollachse
  form: RAW
  status: Online

            </pre>
        </div>
        `;
    });

    document.getElementById("output").innerHTML = html;
}

run();

</script>

</body>
</html>
